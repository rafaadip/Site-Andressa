# CI — FASE-13. Tudo o que um contribuidor roda local, contra Postgres REAL
# (a trava anti-overbooking só existe no banco; teste sem ele não prova nada).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: andressa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/andressa
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/andressa
      TOKEN_SALT: sal-de-teste-com-16-caracteres-ou-mais
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      AGENDAMENTO_SEM_GOOGLE: aceito
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Actions fixadas por SHA (tag ao lado); o Dependabot mantém em dia.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SCA: bloqueia alto/crítico que chegue à produção; o resto só aparece no log.
      - name: npm audit — produção (bloqueante em alto/crítico)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit — completo (informativo)
        continue-on-error: true
        run: npm audit --audit-level=moderate
      # Pelo journal, como em produção — e falha se a constraint sumir.
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - name: contraste WCAG dos tokens
        run: npm run check:contrast
      - name: conformidade CFM/LGPD (termos vedados, CRM à mão, hex cru)
        run: npm run check:conformidade
      - name: unitários + integração (Postgres real), com cobertura mínima
        run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (build de produção)
        run: npm run test:e2e
      - name: Lighthouse mobile (4G simulado) com orçamento
        run: npx -y @lhci/cli@0.15.1 autorun
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorios
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
